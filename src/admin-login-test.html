<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест входа администратора</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #39B7FF;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #39B7FF;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #39B7FF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #2a9ae6;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }
    .result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      display: block;
    }
    .result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      display: block;
    }
    .result pre {
      margin: 10px 0 0 0;
      padding: 10px;
      background: rgba(0,0,0,0.05);
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
    .info {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #004085;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Тест входа администратора</h1>
    
    <div class="info">
      <strong>Для пользователя 004 (email: 2@gmail.com)</strong><br>
      Теперь пользователь с email <code>2@gmail.com</code> имеет права администратора автоматически.
    </div>
    
    <div class="form-group">
      <label for="login">Email или ID:</label>
      <input type="text" id="login" value="2@gmail.com" placeholder="2@gmail.com или 004">
    </div>
    
    <div class="form-group">
      <label for="password">Пароль:</label>
      <input type="password" id="password" placeholder="Введите пароль">
    </div>
    
    <button onclick="testLogin()" id="loginBtn">Войти</button>
    
    <div id="result" class="result"></div>
  </div>

  <script>
    async function testLogin() {
      const login = document.getElementById('login').value;
      const password = document.getElementById('password').value;
      const resultDiv = document.getElementById('result');
      const loginBtn = document.getElementById('loginBtn');
      
      if (!login || !password) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = '❌ Заполните все поля';
        return;
      }
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Вход...';
      resultDiv.className = 'result';
      resultDiv.style.display = 'none';
      
      try {
        // Supabase project ID from /utils/supabase/info.tsx
        const projectId = 'vbjueuhgcyfberivihiv';
        
        const response = await fetch(
          `https://${projectId}.supabase.co/functions/v1/make-server-05aa3c8a/login`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ login, password })
          }
        );
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            ✅ <strong>Успешный вход!</strong><br>
            <br>
            <strong>Пользователь:</strong> ${data.user.имя} ${data.user.фамилия || ''}<br>
            <strong>ID:</strong> ${data.user.id}<br>
            <strong>Email:</strong> ${data.user.email}<br>
            <strong>isAdmin:</strong> ${data.user.isAdmin ? '✅ Да' : '❌ Нет'}<br>
            <br>
            ${data.user.isAdmin ? '🎉 <strong>Права администратора подтверждены!</strong>' : '⚠️ Пользователь НЕ является администратором'}
            <pre>${JSON.stringify(data.user, null, 2)}</pre>
          `;
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            ❌ <strong>Ошибка входа</strong><br>
            ${data.error || 'Неизвестная ошибка'}
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          ❌ <strong>Ошибка сети</strong><br>
          ${error.message}
        `;
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Войти';
      }
    }
    
    // Allow Enter key to submit
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          testLogin();
        }
      });
    });
  </script>
</body>
</html>
